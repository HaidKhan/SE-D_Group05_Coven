<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — coven. Streetwear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <!-- Shared Top Navigation Bar -->
  <header class="site-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo" aria-label="Coven Home">coven.</a>

      <button
        type="button"
        class="mobile-menu-toggle"
        id="mobileMenuToggle"
        aria-label="Toggle navigation menu"
        aria-expanded="false"
        aria-controls="primaryNav"
      >
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>

      <nav class="primary-nav" id="primaryNav" aria-label="Primary Navigation">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="../index.html" class="nav-link">HOME</a>
          </li>
          <li class="nav-item nav-dropdown">
            <button
              type="button"
              class="nav-link dropdown-toggle"
              id="shopDropdownBtn"
              aria-expanded="false"
              aria-controls="shopDropdownMenu"
            >
              SHOP
              <svg class="chevron-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <ul class="dropdown-menu" id="shopDropdownMenu">
              <li><a href="shop.html" class="dropdown-link">All Drops</a></li>
              <li><a href="shop.html?category=hoodies" class="dropdown-link">Hoodies &amp; Fleece</a></li>
              <li><a href="shop.html?category=tees" class="dropdown-link">Graphic Tees</a></li>
              <li><a href="shop.html?category=outerwear" class="dropdown-link">Outerwear</a></li>
              <li><a href="shop.html?category=accessories" class="dropdown-link">Accessories</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a href="about.html" class="nav-link">ABOUT</a>
          </li>
          <li class="nav-item">
            <a href="contact.html" class="nav-link">CONTACT</a>
          </li>
        </ul>
      </nav>

      <div class="header-actions">
        <span class="action-divider" aria-hidden="true"></span>
        <button type="button" class="icon-btn" id="searchToggleBtn" aria-label="Search store" aria-expanded="false" aria-controls="searchBarPanel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7.5"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21"/>
          </svg>
        </button>

        <a href="login.html" class="icon-btn" aria-label="Account" aria-current="page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/>
            <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/>
          </svg>
        </a>

        <a href="cart.html" class="icon-btn cart-btn" aria-label="Shopping cart">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="20" r="1.3"/>
            <circle cx="18" cy="20" r="1.3"/>
            <path d="M2 3h3l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h9.3a1.5 1.5 0 0 0 1.4-1.1L21 7H6"/>
          </svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
      </div>
    </div>

    <!-- Collapsible Search Bar -->
    <div class="search-panel" id="searchBarPanel" hidden>
      <form class="search-form" action="shop.html" method="get" role="search">
        <input
          type="search"
          name="q"
          class="search-input"
          placeholder="Search hoodies, tees, outerwear..."
          aria-label="Search Coven products"
        >
        <button type="submit" class="search-submit">SEARCH</button>
      </form>
    </div>
  </header>

  <!-- Main Content -->
  <main class="login-main">
    <section class="login-split" aria-labelledby="loginHeading">
      <!-- Left Side: Product Image (replace src or overwrite images/login-product.svg later) -->
      <div class="login-media-panel">
        <div class="login-image-frame">
          <img
            id="loginProductImage"
            src="../images/login-product.svg"
            alt="Coven streetwear featured product image"
            class="login-product-image"
          >
        </div>
      </div>

      <!-- Right Side: Login Form -->
      <div class="login-form-panel">
        <div class="login-card">
          <header class="login-header">
            <h1 id="loginHeading" class="login-title">Welcome back!</h1>
            <p class="login-subtitle">Login to continue shopping</p>
          </header>

          <form class="login-form" id="loginForm" action="#" method="post" novalidate>
            <div class="input-group">
              <label for="loginEmail" class="sr-only">Email Address</label>
              <span class="input-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/>
                </svg>
              </span>
              <input
                type="email"
                id="loginEmail"
                name="email"
                class="login-input"
                placeholder="Email Address"
                autocomplete="email"
                required
              >
            </div>

            <div class="input-group">
              <label for="loginPassword" class="sr-only">Password</label>
              <span class="input-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="11" width="16" height="10" rx="2"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                id="loginPassword"
                name="password"
                class="login-input"
                placeholder="Password"
                autocomplete="current-password"
                required
              >
              <button
                type="button"
                id="passwordToggleBtn"
                class="password-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/>
                  <circle cx="12" cy="12" r="2.5"/>
                </svg>
              </button>
            </div>

            <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>

            <button type="submit" class="login-submit-btn">Login</button>
          </form>

          <p class="signup-prompt">
            Don't have an account? <a href="signup.html" class="signup-link">Sign up</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared Bottom Footer Bar -->
  <footer class="site-footer">
    <div class="footer-container">
      <a href="../index.html" class="footer-logo" aria-label="Coven Home">coven.</a>

      <nav class="footer-links" aria-label="Footer Navigation">
        <a href="contact.html" class="footer-link">CONTACT US</a>
        <a href="about.html" class="footer-link">ABOUT US</a>
      </nav>

      <div class="footer-social">
        <span class="follow-label">FOLLOW</span>
        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="footer-link">INSTAGRAM</a>
        <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="footer-link">FACEBOOK</a>
      </div>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
