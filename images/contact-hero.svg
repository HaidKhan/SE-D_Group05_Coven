<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Coven Contact Us studio editorial banner">
  <defs>
    <linearGradient id="contactBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241419" />
      <stop offset="52%" stop-color="#3c1a25" />
      <stop offset="100%" stop-color="#6E263B" />
    </linearGradient>
    <linearGradient id="contactCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF3EA" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#E9D5CC" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#contactBg)" />
  <rect x="44" y="38" width="1112" height="344" fill="url(#contactCard)" stroke="#E9D5CC" stroke-opacity="0.25" stroke-width="1.2" />

  <!-- Decorative editorial lines -->
  <line x1="110" y1="210" x2="310" y2="210" stroke="#B64D61" stroke-width="1.5" stroke-opacity="0.7" />
  <line x1="890" y1="210" x2="1090" y2="210" stroke="#B64D61" stroke-width="1.5" stroke-opacity="0.7" />
  <circle cx="110" cy="210" r="4" fill="#E9D5CC" fill-opacity="0.7" />
  <circle cx="1090" cy="210" r="4" fill="#E9D5CC" fill-opacity="0.7" />

  <!-- Subtle corner monograms -->
  <text x="82" y="82" fill="#E9D5CC" fill-opacity="0.55" font-family="DM Sans, Arial, sans-serif" font-size="12" letter-spacing="4">COVEN STUDIO</text>
  <text x="1118" y="82" text-anchor="end" fill="#E9D5CC" fill-opacity="0.55" font-family="DM Sans, Arial, sans-serif" font-size="12" letter-spacing="4">EST. 2026</text>

  <!-- Main Heading -->
  <text x="600" y="182" text-anchor="middle" fill="#FAF3EA" font-family="Playfair Display, Georgia, serif" font-size="64" font-weight="700" letter-spacing="-0.5">Contact Us</text>
  <text x="600" y="232" text-anchor="middle" fill="#E9D5CC" font-family="DM Sans, Arial, sans-serif" font-size="14" letter-spacing="5">ORDERS · RETURNS · SIZING · COLLECTIVE</text>

  <text x="600" y="346" text-anchor="middle" fill="#B64D61" font-family="DM Sans, Arial, sans-serif" font-size="12" letter-spacing="4">WE ARE HERE FOR THE CIRCLE</text>
</svg>
