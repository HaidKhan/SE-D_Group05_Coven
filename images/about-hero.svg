<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Coven streetwear editorial placeholder banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241419" />
      <stop offset="55%" stop-color="#3a1924" />
      <stop offset="100%" stop-color="#6E263B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B64D61" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E9D5CC" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- Subtle architectural grid / editorial frames -->
  <rect x="48" y="42" width="1104" height="396" fill="none" stroke="#E9D5CC" stroke-opacity="0.2" stroke-width="1.2" />
  <line x1="410" y1="42" x2="410" y2="438" stroke="#E9D5CC" stroke-opacity="0.14" stroke-width="1" />
  <line x1="790" y1="42" x2="790" y2="438" stroke="#E9D5CC" stroke-opacity="0.14" stroke-width="1" />

  <!-- Abstract garment silhouette & layered fabric panels -->
  <rect x="130" y="96" width="210" height="288" rx="4" fill="#FAF3EA" fill-opacity="0.06" stroke="#E9D5CC" stroke-opacity="0.28" />
  <path d="M185 170 L212 152 L258 152 L285 170 L306 218 L280 230 L272 204 L272 325 L198 325 L198 204 L190 230 L164 218 Z" fill="#E9D5CC" fill-opacity="0.88" />
  <path d="M214 152 Q235 172 256 152" fill="none" stroke="#241419" stroke-width="3" />

  <rect x="860" y="96" width="210" height="288" rx="4" fill="url(#accentGrad)" stroke="#B64D61" stroke-opacity="0.45" />
  <circle cx="965" cy="215" r="54" fill="none" stroke="#FAF3EA" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="965" cy="215" r="34" fill="#B64D61" fill-opacity="0.45" />
  <text x="965" y="314" text-anchor="middle" fill="#FAF3EA" fill-opacity="0.85" font-family="DM Sans, Arial, sans-serif" font-size="13" letter-spacing="4">EST. 2024</text>

  <!-- Center Brand Emblem -->
  <text x="600" y="215" text-anchor="middle" fill="#FAF3EA" font-family="Playfair Display, Georgia, serif" font-size="68" font-weight="700" letter-spacing="-1">coven.</text>
  <line x1="540" y1="242" x2="660" y2="242" stroke="#B64D61" stroke-width="2" />
  <text x="600" y="274" text-anchor="middle" fill="#E9D5CC" font-family="DM Sans, Arial, sans-serif" font-size="13" letter-spacing="5">HEAVYWEIGHT STREETWEAR STUDIO</text>
  <text x="600" y="396" text-anchor="middle" fill="#E9D5CC" fill-opacity="0.6" font-family="DM Sans, Arial, sans-serif" font-size="11" letter-spacing="2">REPLACE WITH STUDIO PHOTO (images/about-hero.svg)</text>
</svg>
